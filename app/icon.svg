  <polygon
    points="32,15 46.7,23.5 46.7,40.5 32,49 17.3,40.5 17.3,23.5"
    fill="none" stroke="#f4f0e8" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="9" fill="none" stroke="#c9a227" stroke-width="2.25"/>
</svg>
