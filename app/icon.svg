<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Institutional mark: benzene ring on academic navy. Palette = design tokens
       (navy #14254a, ivory #f4f0e8, gold #c9a227). -->
